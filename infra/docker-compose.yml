version: '3.8'

services:
  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: deep_blue_db
    environment:
      POSTGRES_USER: deepblue
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: deepbluedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Панель управления базой данных
  pgadmin:
    image: dpage/pgadmin4
    container_name: deep_blue_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@deepblue.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Брокер сообщений для микросервисов
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: deep_blue_rmq
    ports:
      - "5672:5672"   # Порт для сервисов
      - "15672:15672" # Веб-интерфейс RabbitMQ

volumes:
  pgdata: